version: "3.3"
services:
  mongo:
    image: mongo:4.4.16
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=tablatura_user
      - MONGO_INITDB_ROOT_PASSWORD=tablatura_password
      - MONGO_INITDB_DATABASE=tablatura
    ports:
      - "27017:27017"
    volumes:
      - mongo_volume:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
volumes:
  mongo_volume:
